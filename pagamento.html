
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finalizar pagamento</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;

    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 10px;
}

/* QUADRO PRINCIPAL */

.container {
    width: 100%;
    max-width: 730px;

    height: min(590px, calc(100svh - 30px));
    min-height: 0;

    background: #a6a6a6;

    border-radius: 6px;

    padding: 16px 25px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* TÍTULO */

h1 {
    font-size: 24px;
    font-weight: normal;
    margin-bottom: 15px;
    text-align: center;
}

/* PRODUTO */

.produto {
    width: 190px;
    height: 75px;

    background: white;
    border-radius: 5px;

    display: flex;
    align-items: center;
    gap: 12px;

    padding: 7px;
    margin-bottom: 12px;
}

.capa {
    width: 46px;
    height: 61px;

    background: #f05aa1;
    color: white;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
    font-size: 9px;
    font-weight: bold;
}

.info-produto {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 14px;
}

.total {
    background: #81c9ed;
    padding: 4px;
    font-size: 13px;
}

/* PAGAMENTO */

.opcoes {
    width: 390px;
    max-width: 100%;

    display: flex;
    flex-direction: column;
    gap: 9px;

    margin-bottom: 15px;
}

.opcao {
    height: 43px;
    width: 100%;

    background: #e0e0e0;

    display: flex;
    align-items: center;
    gap: 16px;

    padding: 0 15px;

    border-radius: 5px;

    font-size: 20px;
    cursor: pointer;
}

.opcao:hover {
    background: #eeeeee;
}

.opcao input {
    width: 23px;
    height: 23px;
    accent-color: #1684ff;
    cursor: pointer;
}

/* DIVISÓRIA */

.divisoria {
    width: 390px;
    max-width: 100%;

    display: flex;
    align-items: center;
    gap: 12px;

    margin-bottom: 13px;

    font-size: 14px;
    white-space: nowrap;
    color: #333;
}

.divisoria::before,
.divisoria::after {
    content: "";
    height: 2px;
    background: #777;
    flex: 1;
}

/* CAMPOS */

.campos {
    width: 390px;
    max-width: 100%;

    display: flex;
    flex-direction: column;
    gap: 9px;
}

.campo {
    width: 100%;
    height: 41px;

    background: white;

    display: flex;
    align-items: center;

    padding: 0 12px;

    border-radius: 5px;
    border: 1px solid #ddd;
}

.icone {
    width: 27px;
    font-size: 17px;
    color: #666;
}

.campo input {
    flex: 1;
    min-width: 0;

    border: none;
    outline: none;

    background: transparent;

    font-size: 14px;
    padding: 7px;
}

.mostrar-senha {
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 16px;
}

/* AVISO */

.aviso {
    width: 390px;
    max-width: 100%;

    font-size: 12px;
    margin-top: 5px;
    margin-bottom: 12px;
}

/* BOTÃO */

.confirmar {
    width: 390px;
    max-width: 100%;

    height: 43px;

    background: #2000b9;
    color: white;

    border: none;
    border-radius: 5px;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.confirmar:hover {
    background: #16008d;
}

/* TELAS MENORES */

@media (max-width: 500px) {
    .container {
        padding: 15px;
    }

    h1 {
        font-size: 21px;
    }

    .opcoes,
    .campos,
    .divisoria,
    .aviso,
    .confirmar {
        width: 100%;
    }

    .opcao {
        font-size: 17px;
    }
}

@media (max-height: 580px) {
    .container {
        padding: 8px 20px;
    }

    h1 {
        font-size: 20px;
        margin-bottom: 7px;
    }

    .produto {
        height: 60px;
        margin-bottom: 7px;
    }

    .capa {
        height: 48px;
    }

    .opcoes {
        gap: 5px;
        margin-bottom: 8px;
    }

    .opcao {
        height: 35px;
    }

    .divisoria {
        margin-bottom: 7px;
    }

    .campos {
        gap: 5px;
    }

    .campo {
        height: 34px;
    }

    .aviso {
        margin: 3px 0 6px;
    }

    .confirmar {
        height: 37px;
    }
}
</style>
</head>

<body>

<main class="container">

    <h1>Finalizar pagamento</h1>

    <div class="produto">

        <div class="capa">
            ♡<br>
            O<br>
            ACORDO<br>
            ELLE KENNEDY
        </div>

        <div class="info-produto">
            <span>O acordo</span>
            <span class="total">Total: R$ 58,41</span>
        </div>

    </div>

    <form id="formPagamento">

        <div class="opcoes">

            <label class="opcao">
                <input type="radio" name="pagamento" value="Pix" checked>
                <span>Pix</span>
            </label>

            <label class="opcao">
                <input type="radio" name="pagamento" value="Cartão de Crédito">
                <span>Cartão de Crédito</span>
            </label>

            <label class="opcao">
                <input type="radio" name="pagamento" value="Cartão de Débito">
                <span>Cartão de Débito</span>
            </label>

        </div>

        <div class="divisoria">
            Dados para contato e acesso
        </div>

        <div class="campos">

            <div class="campo">
                <span class="icone">✉</span>
                <input type="email" id="email" placeholder="E-mail" required>
            </div>

            <div class="campo">
                <span class="icone">♧</span>
                <input type="tel" id="telefone" placeholder="Telefone (opcional)">
            </div>

            <div class="campo">
                <span class="icone">🔒</span>
                <input type="password" id="senha" placeholder="Senha" minlength="6" required>

                <button type="button" class="mostrar-senha" onclick="mostrarSenha()">
                    👁
                </button>
            </div>

        </div>

        <p class="aviso">Mínimo de 6 caracteres</p>

        <button type="submit" class="confirmar">
            Confirmar pagamento
        </button>

    </form>

</main>

<script>

function mostrarSenha() {
    const senha = document.getElementById("senha");

    senha.type = senha.type === "password" ? "text" : "password";
}

document.getElementById("formPagamento").addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    const forma = document.querySelector('input[name="pagamento"]:checked');

    if (!email || senha.length < 6 || !forma) {
        alert("Preencha os dados corretamente!");
        return;
    }

    alert("Simulação concluída!\nForma de pagamento: " + forma.value);

});

</script>

</body>
</html>
